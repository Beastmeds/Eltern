<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frohe Weihnachten!</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #2a2a72, #6a1b9a);
    font-family: 'Arial', sans-serif;
    overflow: hidden;
    flex-direction: column;
    color: #fff;
  }

  h1 {
    text-align: center;
    margin-bottom: 40px;
    font-size: 2em;
    text-shadow: 2px 2px 6px #000;
  }

  .gift-wrapper {
    perspective: 1000px;
  }

  .gift {
    width: 180px;
    height: 180px;
    position: relative;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 1s ease;
  }

  .lid, .box {
    position: absolute;
    width: 100%;
    height: 50%;
    border-radius: 15px;
  }

  .lid {
    top: 0;
    background: #c62828;
    z-index: 2;
    transform-origin: top center;
    transition: transform 1s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  }

  .box {
    bottom: 0;
    background: #d32f2f;
    z-index: 1;
  }

  .ribbon-vertical, .ribbon-horizontal {
    position: absolute;
    background: gold;
  }

  .ribbon-vertical {
    width: 20px;
    height: 100%;
    left: 50%;
    transform: translateX(-50%);
  }

  .ribbon-horizontal {
    width: 100%;
    height: 20px;
    top: 50%;
    transform: translateY(-50%);
  }

  .gift.open .lid {
    transform: rotateX(-180deg);
  }

  .message {
    position: absolute;
    bottom: -150px;
    background: white;
    color: #222;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    width: 300px;
    opacity: 0;
    transform: translateY(30px);
    transition: all 1s ease 0.5s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  .gift.open .message {
    opacity: 1;
    transform: translateY(0);
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<h1>Ein Weihnachtsgeschenk für euch!</h1>

<div class="gift-wrapper">
  <div class="gift" id="gift">
    <div class="lid"></div>
    <div class="box"></div>
    <div class="ribbon-vertical"></div>
    <div class="ribbon-horizontal"></div>
    <div class="message" id="message">
      🎁 Frohe Weihnachten! 🎄<br>
      Hier ist euer Gutschein: 50% Rabatt auf alles!<br>
      Habt einen wundervollen Tag!
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
  const gift = document.getElementById('gift');
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let confettiParticles = [];

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  function createConfetti() {
    const colors = ['#ff0', '#f00', '#0f0', '#0ff', '#f0f', '#fff', '#ff8c00', '#8a2be2'];
    for(let i=0; i<200; i++){
      confettiParticles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        r: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        tilt: Math.random() * 10 - 10,
        tiltAngleIncrement: Math.random() * 0.07 + 0.05,
        tiltAngle: 0,
        speed: Math.random() * 3 + 2
      });
    }
  }

  function drawConfetti() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confettiParticles.forEach(p => {
      ctx.beginPath();
      ctx.lineWidth = p.r / 2;
      ctx.strokeStyle = p.color;
      ctx.moveTo(p.x + p.tilt + p.r/4, p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r/4);
      ctx.stroke();
      p.tiltAngle += p.tiltAngleIncrement;
      p.y += (Math.cos(p.tiltAngle) + 3 + p.speed)/2;
      p.x += Math.sin(p.tiltAngle) * 2;
      if(p.y > canvas.height) p.y = -10;
    });
    requestAnimationFrame(drawConfetti);
  }

  gift.addEventListener('click', () => {
    gift.classList.add('open');
    createConfetti();
    drawConfetti();
  });

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>
</body>
</html>
